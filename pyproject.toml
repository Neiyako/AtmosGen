[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atmosgen"
version = "1.1.0"
description = "Atmospheric synthetic data generation: unified data contract, SDV statistical generation, self-written 2D advection-diffusion solver, hybrid physics-conditioned generation, four-class quality validation"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "AtmosGen contributors" }]
keywords = [
  "atmospheric-science",
  "synthetic-data",
  "sdv",
  "pde-solver",
  "era5",
  "quality-validation",
  "climate",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Atmospheric Science",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Natural Language :: Chinese (Simplified)",
  "Natural Language :: English",
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "xarray>=2023.6",
  "netCDF4>=1.6",
  "zarr>=2.16",
  "dask>=2023.5",
  "PyYAML>=6.0",
  "pydantic>=2.4",
  "typer>=0.9",
  "scipy>=1.10",
  "matplotlib>=3.7",
  "psutil>=5.9",
]

[project.optional-dependencies]
# Statistical generation (Mode 1). Needed for `generate --config configs/stat_*.yaml`.
stat = ["sdv>=2.0", "sdmetrics>=0.20", "scikit-learn>=1.3"]
dev = ["pytest>=7.4"]

[project.urls]
Homepage = "https://github.com/Neiyako/AtmosGen"
Repository = "https://github.com/Neiyako/AtmosGen"
Changelog = "https://github.com/Neiyako/AtmosGen/blob/main/CHANGELOG.md"

[project.scripts]
atmosgen = "atmosgen.cli:app"

[tool.setuptools.packages.find]
include = ["atmosgen*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning"]
