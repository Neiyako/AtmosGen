[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atmosgen"
version = "0.1.0"
description = "Atmospheric synthetic data generation framework: data contract, IO, adapters, task execution and quality validation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Research use only (see docs/DEPENDENCY_COMPATIBILITY.md and README license section)" }
authors = [{ name = "AtmosGen" }]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "xarray>=2023.6",
  "netCDF4>=1.6",
  "zarr>=2.16",
  "dask>=2023.5",
  "PyYAML>=6.0",
  "pydantic>=2.4",
  "typer>=0.9",
  "scipy>=1.10",
  "matplotlib>=3.7",
  "psutil>=5.9",
]

[project.optional-dependencies]
# Statistical generation (Mode 1). Not needed to validate configs / ingest real data.
stat = ["sdv>=2.0", "sdmetrics>=0.20", "scikit-learn>=1.3"]
dev = ["pytest>=7.4"]

[project.scripts]
atmosgen = "atmosgen.cli:app"

[tool.setuptools.packages.find]
include = ["atmosgen*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning"]
